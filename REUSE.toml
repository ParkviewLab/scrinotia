# Catch-all REUSE annotations; per-file SPDX headers still win where present.
# Verify: uvx --from "reuse[charset-normalizer]" reuse lint
version = 1

SPDX-PackageName = "Scrinotia"
SPDX-PackageSupplier = "Gary Frattarola <garyf@parkviewlab.ai>"

[[annotations]]
path = ["docs/**", "README.md", "LICENSING.md", "CHANGELOG.md", "REUSE.toml", ".gitignore", "AGENTS.md", "CLAUDE.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["LICENSE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [".github/**", "package.json", "package-lock.json", "electron-builder.yml", "tests/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["docs/references/obsidian-api/**"]
precedence = "override"
SPDX-FileCopyrightText = "2022 Dynalist Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["docs/references/obsidian-bases-skill/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Steph Ango"
SPDX-License-Identifier = "MIT"

# The app icon and the brand kit it comes from are a mark: all rights
# reserved, not relicensed by the repository.
[[annotations]]
path = ["build/icon.png", "build/icon.svg", "build/icon.icns", "brand/**", "site/assets/icon.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# Chromium's compiled en-US Hunspell dictionary, shipped with the Linux
# packages for spell checking without a download (src/main/spelling.js). Taken
# unmodified from Electron 43.8.0's hunspell_dictionaries.zip. The word list is
# SCOWL's (its README, kept verbatim as LICENSES/LicenseRef-SCOWL.txt, gives
# the terms of every source); Chromium's hunspell_dictionaries repository,
# which compiles it, is under the Apache License 2.0.
[[annotations]]
path = ["build/dictionaries/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2000-2018 Kevin Atkinson", "The Chromium Authors"]
SPDX-License-Identifier = "LicenseRef-SCOWL AND Apache-2.0"

# The documentation site's screenshot: the app showing an invented demo vault.
[[annotations]]
path = ["site/assets/screenshot.webp"]
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "CC-BY-4.0"
